          <!-- 2. About Company Section -->

            <h2>Dobrodošli pri Claviro Cleaning — Vaš zanesljiv partner za brezhibne in zdrave prostore</h2>
            <p>
              Pri Claviro Cleaning verjamemo, da je brezhibno čisto okolje temelj zdravja, produktivnosti in odličnega počutja. Smo zaupanja vreden ponudnik profesionalnih rešitev za čiščenje, specializiran za hotelsko gospodinjstvo, čiščenje hotelov ter vrhunsko poslovno čiščenje. Naše celovite čistilne storitve so skrbno prilagojene specifičnim zahtevam hotelov, turističnih nastanitev, pisarn ter večjih poslovnih objektov po celotni Sloveniji.
            </p>
            <p>
              Zavedamo se, da vsak objekt zahteva individualen in strokoven pristop. Pred začetkom sodelovanja skupaj z vami podrobno analiziramo potrebe objekta, določimo ključne higienske protokole ter oblikujemo prilagojen načrt vzdrževanja. Naše ekipe za hotelsko čiščenje, sobarice in operativni vodje delujejo skladno z najvišjimi evropskimi standardi kakovosti ter z uporabo varnih, okolju prijaznih in visoko učinkovitih čistilnih sredstev.
            </p>
            <p>
              Ne glede na to, ali potrebujete redno dnevno hotelsko gospodinjstvo, okrepitev čistilnih ekip v času visoke turistične sezone, zanesljivo poslovno čiščenje pisarn ali specializirano profesionalno čiščenje prostorov po prenovi — Claviro Cleaning poskrbi za vsako podrobnost. Naše čistilne storitve zagotavljajo brezhibno urejenost, naša koordinacijska ekipa pa nudi stalno podporo 24 ur na dan, kar vam prinaša popolno varnost in zanesljivost pri vsakodnevnem poslovanju.
            </p>
            <ul>
              <li>Celovito hotelsko gospodinjstvo in natančna priprava sob</li>
              <li>Strokovno poslovno čiščenje pisarn in poslovnih stavb</li>
              <li>Prilagodljive sezonske čistilne ekipe za čiščenje hotelov</li>
              <li>Specializirano in globinsko profesionalno čiščenje površin</li>
            </ul>
          </section>

            </p>

              </p>
              <ul>
                <li>Dnevno čiščenje sob in kopalnic po hotelskih standardih</li>
                <li>Priprava postelj in strokovna menjava hotelskega perila</li>
                <li>Dopolnjevanje hotelskih pripomočkov in kozmetike</li>
              </ul>
            </article>

              </p>
              <ul>
                <li>Prilagodljiva sezonska kadrovska okrepitev za hotele</li>
                <li>Hitra priprava sob med odhodi in prihodi gostov</li>
                <li>Usklajeno vodenje čistilne ekipe na lokaciji</li>

              <p>
                Zanesljiva kratkoročna pomoč ob nenadnih odsotnostih, bolniških dopustih ali posebnih hotelskih dogodkih. Zagotavljamo hitro razpoložljivost izkušenega osebja, ki se brez zapletov vključi v vaš ustaljen potek dela.
              </p>
              <ul>
                <li>Hitra zamenjava in kratkoročna podpora pri čiščenju</li>
                <li>Minimalen čas uvajanja osebja v hotelsko delo</li>
                <li>Popolna operativna razbremenitev vaše redne ekipe</li>
              </ul>
            </article>

            <article>
              <h3>Prilagodljivo podizvajalsko čiščenje</h3>
              <p>
                Strateško partnerstvo za podjetja in upravnike nepremičnin, ki potrebujejo zanesljivega podizvajalca za redno čiščenje objektov. Prevzamemo celotno skrb za kadre, organizacijo dela ter stalno kontrolo kakovosti.
              </p>
              <ul>
                <li>Zanesljivo pogodbeno sodelovanje na dolgi rok</li>
                <li>Stalna kontrola kakovosti z internim nadzorom na terenu</li>
                <li>Zmanjšanje administrativnih in kadrovskih stroškov dela</li>
              </ul>

              <p>
                Redno vzdrževalno in higiensko poslovno čiščenje pisarn, poslovnih stavb, bančnih poslovalnic in prodajnih salonov. Zagotavljamo čist, urejen in zdrav delovni prostor, ki podpira dobro počutje in večjo delovno učinkovitost vaših zaposlenih.
